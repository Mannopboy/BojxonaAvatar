# Host nginx (edge) — HTTP. `certbot --nginx` keyin 443/SSL va redirect'ni AVTOMATIK qo'shadi.
# / → frontend (127.0.0.1:8090) · /api/ → backend (8091, /api olib tashlanadi) · /ws/ → backend (WebSocket)
server {
    listen 80;
    server_name bojxona.fintech-company.uz;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        # trailing slash → "/api" prefiksi olib tashlanadi (backend / da: /faq, /avatar/ask)
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    # Gemini Live real-time audio (WebSocket)
    location /ws/ {
        proxy_pass http://127.0.0.1:8091/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
