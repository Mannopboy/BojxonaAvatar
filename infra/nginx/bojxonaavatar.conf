# Host nginx (edge, TLS) — /opt yoki /etc/nginx/sites-available/
# / → frontend (127.0.0.1:8090), /api/ → backend (127.0.0.1:8091, /api olib tashlanadi)
server {
    listen 443 ssl http2;
    server_name bojxona.fintech-company.uz;                      # ⬅️ real domenga o'zgartiring

    ssl_certificate     /etc/letsencrypt/live/bojxona.fintech-company.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bojxona.fintech-company.uz/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        # trailing slash → "/api" prefiksi olib tashlanadi (backend / da: /faq, /avatar/ask)
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;      # Gemini grounding sekinroq bo'lishi mumkin
    }

    # Gemini Live real-time audio (WebSocket) — /ws/live
    location /ws/ {
        proxy_pass http://127.0.0.1:8091/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;    # uzoq suhbat
    }
}

server {
    listen 80;
    server_name bojxona.fintech-company.uz;
    return 301 https://$host$request_uri;
}
