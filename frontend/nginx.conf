# Frontend konteyner nginx — statik SPA (host nginx /api ni backendga yo'naltiradi)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik resurslar (3D model, js, css) — uzoq kesh
    location ~* \.(glb|js|css|woff2?|png|jpe?g|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
